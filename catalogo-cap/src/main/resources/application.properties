spring.application.name=catalogo-cap
spring.profiles.active=dev

# CORRETTO: Ora punta a catalogo_cap, allineato con il Docker Compose
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_cap?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# Ti permette di vedere sul terminale se Spring Boot sta creando correttamente le tabelle
spring.jpa.show-sql=true

server.forward-headers-strategy=framework
upload.path=uploads
server.port=8081


# TASK 3: Esposizione metriche per Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.web.server.request.autotime.enabled=true