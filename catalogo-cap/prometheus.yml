global:
  scrape_interval: 5s # Intervallo di controllo rapido per l'esame

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Usiamo "app" come hostname perché Docker risolve automaticamente 
      # il nome del servizio dentro la stessa rete 'app-network'
      - targets: ['app:8080']